<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de la boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<header>
  <h1 id="titulo">Tablero</h1>
  <div class="info"><span id="cuenta"></span></div>
  <div class="sp"></div>
  <span class="modo" id="modo"></span>
  <button class="btn" id="nuevo" style="display:none">Nueva tarea</button>
  <button class="lnk" id="salir" style="display:none">Cerrar sesión</button>
</header>
<p id="aviso" hidden></p>
<div id="wrap"><div id="frame"><div id="board"></div></div></div>
<div id="toast" role="status"></div>

<div id="lock" role="dialog" aria-modal="true" aria-labelledby="lock_t" hidden>
  <div class="lk">
    <h2 id="lock_t">Caja fuerte del plan</h2>
    <div class="safe">
      <div class="leds">
        <span><i id="led_r" class="on"></i>LISTO</span>
        <span><i id="led_e"></i>ERROR</span>
        <span><i id="led_p"></i>ABIERTO</span>
      </div>
      <div class="lcd"><div id="lock_dots" aria-hidden="true"></div></div>
      <p id="lock_msg" role="status"></p>
      <div id="lock_pad"></div>
      <form id="lock_mail" hidden>
        <label for="lock_correo">Código correcto. Ahora escribe tu correo</label>
        <input id="lock_correo" type="email" autocomplete="email" inputmode="email" placeholder="correo@ejemplo.com" required>
        <button type="submit" class="ent">Abrir</button>
        <button type="button" id="lock_atras" class="atras">Volver al código</button>
      </form>
    </div>
    <p class="lk-h">El código es la fecha de la boda. Luego escribe el correo con el que te registraron: los administradores editan y los demás solo miran el tablero.</p>
  </div>
</div>

<dialog id="dlg">
  <form id="frm">
    <h2 id="dtitulo">Nueva tarea</h2>
    <label>Título<input id="f_titulo" maxlength="120"></label>
    <p class="err" id="err"></p>
    <label>Responsable<input id="f_responsable" maxlength="80"></label>
    <label>Fecha o cita<input id="f_fecha" maxlength="80" placeholder="12 mar, 3:00 pm"></label>
    <label>Detalle (nota amarilla)<textarea id="f_detalle" rows="2" maxlength="400"></textarea></label>
    <label>Imagen (link https, link de Drive o ruta como img/playa.jpg)<input id="f_imagen" maxlength="500"></label>
    <label>Dibujo si no hay imagen<select id="f_escena"></select></label>
    <label>Conecta con (números de tarjeta, separados por coma)<input id="f_conecta" maxlength="60" placeholder="3,4"></label>
    <div class="row">
      <button type="button" class="danger" id="b_del">Eliminar</button>
      <span class="sp"></span>
      <button type="button" class="sec" id="b_cancel">Cancelar</button>
      <button type="submit" class="btn dark" id="b_save">Guardar</button>
    </div>
  </form>
</dialog>

<script src="js/config.js"></script>
<script src="js/escenas.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
